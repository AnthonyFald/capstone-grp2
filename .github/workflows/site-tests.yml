name: Website and daily-report checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs demo-1/tests/*.test.cjs demo-2/tests/*.test.cjs
      - run: node demo-2/scripts/build-summary.cjs
      - run: git diff --exit-code -- demo-2/docs/evaluation-summary.csv
