name: Build desktop apps
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-apps.yml'
      - 'demo-1/desktop/**'
      - 'demo-1/local-audio/**'
      - 'demo-1/*.js'
      - 'demo-1/*.html'
      - 'demo-1/*.css'
      - 'demo-1/data/**'
permissions:
  contents: read
concurrency:
  group: desktop-apps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Standard runners in this public repository: no paid/larger runners.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: Windows
          - runner: macos-15
            target: Mac-Apple-Silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free build dependencies
        run: python -m pip install -r demo-1/desktop/requirements-build.txt
      - name: Check browser application behavior
        run: node --test demo-1/tests/*.test.cjs tests/*.test.cjs
      - name: Check local audio behavior
        run: python -m unittest discover -s demo-1/local-audio -p "test_*.py"
      - name: Build and test the bundled app with synthetic audio
        run: python demo-1/desktop/build.py --audio-test
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-build/release/*
          if-no-files-found: error
          retention-days: 1
      - name: Preserve diagnostic results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            desktop-build/smoke-*.json
            desktop-build/smoke-data/launcher.log
            desktop-build/work/**/warn-*.txt
          retention-days: 1
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Publish both verified downloads together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          cat > notes.txt <<'EOF'
          Download the ZIP for Windows or Mac with Apple silicon. Python and the audio libraries are included; no terminal commands or Python installation are needed. Extract the download, open Evergreen Meeting Demo, and keep its small window open while using the browser interface.

          Windows: Extract All, open the extracted folder, and double-click Evergreen Meeting Demo.exe. Keep _internal beside it. Mac: unzip, move Evergreen Meeting Demo.app to Applications, and open it. Intel Macs and Windows ARM are not supported by these packages.

          Return to the Demo 1 tab you already have open; it connects to the companion. No browser opens automatically. Click Open demo only when needed; it uses your default browser. First use downloads free models using bundled trusted certificates. Chrome or Edge is needed for AI notes. Processing remains on-device, without a paid AI account or API key. Export transcripts and notes before quitting.

          These student builds are not developer-signed/notarized, so your OS may request first-open approval. Download only from this project's release. Mac users may need System Settings > Privacy & Security > Open Anyway for this app. Do not disable system security. https://support.apple.com/en-us/102445

          Both packaged executables passed GUI-runtime, local-server, transcription and speaker-diarization smoke tests on their target runners using the fictional included recording. Checksums and test reports are attached. Clean-machine launch and browser note performance can still vary by device.
          EOF
          gh release create "desktop-demo-${RUN_NUMBER}" release/* --target "$COMMIT" --latest --title "Evergreen Meeting Demo · desktop build ${RUN_NUMBER}" --notes-file notes.txt
